[project]
name = "flcopilot"
version = "0.1.0"
description = "Copilot sidecar for the Freelancer Carrier Mod: loopback NDJSON server, voice I/O, brain hook"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
# Pinned. The venv lives at $FLMOD_SIDECAR_VENV (never in the repo); see setup_venv.sh and
# requirements.lock for the full resolved set.
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.7.1",
    "kokoro-onnx==0.5.0",
    "onnxruntime==1.24.3",
    "sounddevice==0.5.5",
    "soundfile==0.13.1",
    "numpy==2.4.2",
    "PyYAML==6.0.3",
    # CUDA-12 runtime libs for ctranslate2 (the host has CUDA 13 only); run.sh puts them on LD_LIBRARY_PATH.
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tools"]
addopts = "-p no:cacheprovider"
